name: CI and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要发布的版本标签（例如 v0.1.0）；留空则只运行 CI"
        required: false
        type: string
      prerelease:
        description: "将手动发布标记为预发布版本"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows-build:
    name: Windows x64 checks and build
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Rust toolchain
        run: rustup show

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        shell: pwsh
        run: |
          $output = cargo clippy --locked --all-targets -- -D warnings 2>&1
          $exitCode = $LASTEXITCODE
          $output | Write-Output
          if ($exitCode -ne 0) {
            $details = $output -join "`n"
            $escaped = $details.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Windows Clippy failed::$escaped"
            exit $exitCode
          }

      - name: Run unit tests
        shell: pwsh
        run: |
          $output = cargo test --locked --all-targets 2>&1
          $exitCode = $LASTEXITCODE
          $output | Write-Output
          if ($exitCode -ne 0) {
            $details = $output -join "`n"
            $escaped = $details.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Windows tests failed::$escaped"
            exit $exitCode
          }

      - name: Build release executable
        run: cargo build --locked --release

      - name: Smoke-test executable
        run: target\release\mstsc-rs.exe --version

      - name: Package release files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq "mstsc-rs").version
          $packageName = "mstsc-rs-v$version-windows-x64"

          New-Item -ItemType Directory -Force "dist/package" | Out-Null
          New-Item -ItemType Directory -Force "dist/release" | Out-Null
          Copy-Item "target/release/mstsc-rs.exe" "dist/package/"
          Copy-Item "README.md", "LICENSE" "dist/package/"
          Copy-Item "dist/package/mstsc-rs.exe" "dist/release/"
          Compress-Archive -Path "dist/package/*" -DestinationPath "dist/release/$packageName.zip"

          $checksumFiles = Get-ChildItem "dist/release" -File | Sort-Object Name
          $checksums = $checksumFiles | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content -Encoding ascii "dist/release/SHA256SUMS.txt"

      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mstsc-rs-windows-x64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs:
      - windows-build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Windows package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mstsc-rs-windows-x64
          path: dist

      - name: Validate release version
        id: release
        shell: pwsh
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
          MANUAL_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $ErrorActionPreference = "Stop"
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $packageVersion = ($metadata.packages | Where-Object name -eq "mstsc-rs").version

          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $tag = $env:MANUAL_TAG
            $prerelease = $env:MANUAL_PRERELEASE
          } else {
            $tag = $env:GITHUB_REF_NAME
            $prerelease = "false"
          }

          $expectedTag = "v$packageVersion"
          if ($tag -ne $expectedTag) {
            Write-Error "发布标签必须与 Cargo.toml 版本一致：期望 $expectedTag，实际 $tag"
          }

          if ($tag.Contains("-")) {
            $prerelease = "true"
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "prerelease=$($prerelease.ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          $ErrorActionPreference = "Stop"
          $options = @(
            "--repo", $env:GITHUB_REPOSITORY,
            "--title", $env:RELEASE_TAG,
            "--generate-notes"
          )

          if ($env:IS_PRERELEASE -eq "true") {
            $options += "--prerelease"
          }

          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $options += @("--target", $env:GITHUB_SHA)
          } else {
            $options += "--verify-tag"
          }

          $files = Get-ChildItem "dist" -File | ForEach-Object FullName
          & gh release create $env:RELEASE_TAG @files @options
