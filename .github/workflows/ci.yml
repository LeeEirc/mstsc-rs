name: CI and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要发布的版本标签（例如 v0.1.0）；留空则只运行 CI"
        required: false
        type: string
      prerelease:
        description: "将手动发布标记为预发布版本"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  linux-test:
    name: Linux checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Rust toolchain
        run: rustup show

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run unit tests
        run: cargo test --locked --all-targets

      - name: Check Windows target
        run: cargo check --locked --target x86_64-pc-windows-msvc

  windows-build:
    name: Windows x64 build
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show Rust toolchain
        run: rustup show

      - name: Run unit tests
        run: cargo test --locked --all-targets

      - name: Build release executable
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Smoke-test executable
        run: target\x86_64-pc-windows-msvc\release\mstsc-rs.exe --version

      - name: Package release files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq "mstsc-rs").version
          $packageName = "mstsc-rs-v$version-windows-x64"

          New-Item -ItemType Directory -Force "dist/package" | Out-Null
          New-Item -ItemType Directory -Force "dist/release" | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/mstsc-rs.exe" "dist/package/"
          Copy-Item "README.md", "LICENSE" "dist/package/"
          Copy-Item "dist/package/mstsc-rs.exe" "dist/release/"
          Compress-Archive -Path "dist/package/*" -DestinationPath "dist/release/$packageName.zip"

          $checksumFiles = Get-ChildItem "dist/release" -File | Sort-Object Name
          $checksums = $checksumFiles | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content -Encoding ascii "dist/release/SHA256SUMS.txt"

      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mstsc-rs-windows-x64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs:
      - linux-test
      - windows-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Windows package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mstsc-rs-windows-x64
          path: dist

      - name: Validate release version
        id: release
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
          MANUAL_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          package_version="$(cargo metadata --locked --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "mstsc-rs") | .version')"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$MANUAL_TAG"
            prerelease="$MANUAL_PRERELEASE"
          else
            tag="$GITHUB_REF_NAME"
            prerelease="false"
          fi

          expected_tag="v$package_version"
          if [[ "$tag" != "$expected_tag" ]]; then
            echo "::error::发布标签必须与 Cargo.toml 版本一致：期望 $expected_tag，实际 $tag"
            exit 1
          fi

          if [[ "$tag" == *-* ]]; then
            prerelease="true"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          options=(
            --repo "$GITHUB_REPOSITORY"
            --title "$RELEASE_TAG"
            --generate-notes
          )

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            options+=(--prerelease)
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            options+=(--target "$GITHUB_SHA")
          else
            options+=(--verify-tag)
          fi

          gh release create "$RELEASE_TAG" dist/* "${options[@]}"
